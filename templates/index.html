<!DOCTYPE html>
<html>

<head>

<title>MediaPipe Webcam</title>

</head>

<body>

<h2>MediaPipe Face Mesh</h2>

<video
id="video"
width="640"
height="480"
autoplay
playsinline>
</video>

<br>

<canvas
id="canvas"
style="display:none;">
</canvas>

<img
id="output"
width="640">

<script>

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({
video:true
})

.then(stream=>{

video.srcObject=stream;

});

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

const output=document.getElementById("output");

setInterval(async()=>{

canvas.width=video.videoWidth;

canvas.height=video.videoHeight;

ctx.drawImage(
video,
0,
0
);

const blob=await new Promise(
resolve=>canvas.toBlob(
resolve,
"image/jpeg"
)
);

const form=new FormData();

form.append(
"image",
blob,
"frame.jpg"
);

const response=await fetch(
"/process",
{
method:"POST",
body:form
}
);

const imageBlob=
await response.blob();

output.src=
URL.createObjectURL(
imageBlob
);

},100);

</script>

</body>

</html>
